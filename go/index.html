<!doctype html>
<!-- adr-0493: one static page answers every Share Link. It cannot know what a
     link names (the fragment never reaches a server), so it says nothing
     about it. Store badges are deferred until the app is publicly listed. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Dieser Link öffnet sich in Decito." />
    <title>Decito</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main>
      <a class="back" href="../">← Decito</a>
      <h1>Dieser Link öffnet sich in Decito.</h1>
      <p>Decito ist bald verfügbar.</p>
      <p lang="en">This link opens in Decito. Decito is coming soon.</p>
    </main>
  </body>
</html>
