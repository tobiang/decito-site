    <script>
      (() => {
        const fine = matchMedia("(hover: hover) and (pointer: fine)");
        const still = matchMedia("(prefers-reduced-motion: reduce)");
        if (!fine.matches || still.matches) return;

        const NS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("class", "trail");
        svg.setAttribute("aria-hidden", "true");

        // ONE filled path, not a chain of strokes. Per-segment strokes cannot
        // taper: each carries its own width, and at every joint the wider
        // one's round cap protrudes past the narrower — a bead at each point,
        // at any speed. A ribbon has no caps and no joints, so it has no
        // beads, and its width can go to zero at the tail, which is what
        // "the ink lifts" actually looks like.
        const MAXW = 3.4,
          LIFE = 420;
        const path = document.createElementNS(NS, "path");
        svg.appendChild(path);
        document.body.appendChild(svg);
        document.documentElement.classList.add("ink");

        const pts = [];
        let raf = 0;

        // Where the pen writes is decided by CSS, not by a second list here.
        // The nib cursor is already scoped to the paper — over words it hands
        // back the I-beam, over links the pointer — so the ink simply asks
        // what cursor this element got. One rule, no drift.
        //
        // Cached per element: getComputedStyle on every pointermove would be
        // wasteful, and the answer only changes when the target does.
        let lastEl = null,
          onPaper = false;
        const paper = (el) => {
          if (el !== lastEl) {
            lastEl = el;
            onPaper = getComputedStyle(el).cursor.startsWith("url(");
          }
          return onPaper;
        };

        addEventListener(
          "pointermove",
          (e) => {
            if (e.pointerType !== "mouse") return;
            // No ink over text or links: the stroke would fight the words and
            // smear across a selection drag. The trail already in flight is
            // left to fade rather than being cut off.
            if (!paper(e.target)) return;
            const last = pts[pts.length - 1];
            // Minimum spacing, so a stationary pointer does not stack
            // samples on one spot and bloat the path.
            if (
              last &&
              Math.hypot(e.clientX - last.x, e.clientY - last.y) < 2.5
            )
              return;
            pts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
            if (pts.length > 40) pts.shift();
            if (!raf) raf = requestAnimationFrame(draw);
          },
          { passive: true },
        );

        function draw(now) {
          while (pts.length && now - pts[0].t > LIFE) pts.shift();
          const n = pts.length;
          if (n < 2) {
            path.removeAttribute("d");
            raf = n ? requestAnimationFrame(draw) : 0;
            return;
          }

          // Walk one edge out and the other back. Half-width follows age, so
          // the ribbon is widest under the cursor and closes to a point where
          // the ink has dried.
          const l = [],
            r = [];
          for (let i = 0; i < n; i++) {
            const p = pts[i],
              a = pts[Math.max(0, i - 1)],
              b = pts[Math.min(n - 1, i + 1)];
            let dx = b.x - a.x,
              dy = b.y - a.y;
            const len = Math.hypot(dx, dy) || 1;
            dx /= len;
            dy /= len;
            const k = Math.max(0, 1 - (now - p.t) / LIFE);
            const w = (MAXW * k * k) / 2;
            l.push([p.x - dy * w, p.y + dx * w]);
            r.push([p.x + dy * w, p.y - dx * w]);
          }

          // Curves, not facets. pointermove samples at whatever rate the
          // pointer moves, so a fast sweep leaves the points far apart and
          // straight edges between them read as a polygon. Each sample becomes
          // the control point of a quadratic through the midpoints, which is a
          // smooth spline with no extra samples to collect.
          const edge = (q, first) => {
            let out = `${first ? "M" : "L"}${q[0][0].toFixed(1)},${q[0][1].toFixed(1)}`;
            for (let i = 1; i < q.length; i++) {
              const a = q[i - 1],
                b = q[i];
              out +=
                `Q${a[0].toFixed(1)},${a[1].toFixed(1)} ` +
                `${((a[0] + b[0]) / 2).toFixed(1)},${((a[1] + b[1]) / 2).toFixed(1)}`;
            }
            const last = q[q.length - 1];
            return out + `L${last[0].toFixed(1)},${last[1].toFixed(1)}`;
          };

          // Out along one edge, back along the other. Both ends close to a
          // point, so the ribbon needs no caps.
          path.setAttribute(
            "d",
            edge(l, true) + edge(r.slice().reverse(), false) + "Z",
          );

          raf = requestAnimationFrame(draw);
        }
      })();
