openapi: 3.0.3
info:
  title: Decito Public API
  version: "1"
  description: |
    Add items to one Decito collection from outside the app.

    An API key belongs to one collection and is made in the app by an Admin or the
    Owner of that collection („Verwalten" → „API-Schlüssel"). It is shown once.
    Whatever a key adds belongs to no person in the collection: nobody is notified,
    and the item says it came from the key.

    A field this API does not know is refused, never ignored. Fields added
    later never change what a call without them does; a change that would
    break a caller comes as a new address beside this one. Answers may gain
    fields and new error codes may appear: branch on the HTTP status, and
    read an `error` you do not know by its status.

    Retry a `429` or `503` after `Retry-After` seconds. Any other `4xx` will
    answer the same until the call or the key changes, so do not retry it.
    Every answer carries an `X-Request-Id`; name it when you report a
    failure.

    Design for the key to leak: give each service its own key, and revoke one
    in the app the moment you suspect it.
  license:
    name: Proprietary
    url: https://decito.app/en/terms/
servers:
  - url: https://api.decito.app/functions/v1
security:
  - apiKey: []
paths:
  /items:
    post:
      operationId: addItem
      summary: Add an item, or bring its twin back
      description: |
        The title is matched against the collection the way the app's quick-add
        bar matches it: case, surrounding spaces and German umlauts do not
        matter („Kaese" finds „Käse"). Without a match, a new item is added.

        A match that is open gets only what it lacks: an empty day, amount,
        link or assignee is filled, a different one is left alone. A match
        that was completed comes back as a fresh round: its checklist
        unticked, its old amount gone, a day in the past moved to today. A
        hidden match stays hidden, and a day outside a match's own span is
        not set.

        Every success answers the same, whatever happened — the hidden and
        the out-of-span cases included, so a key cannot learn what the
        collection holds. The app shows what each call did on the key's page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItem"
            examples:
              chore:
                summary: A chore for the key's maker, today
                value:
                  title: Spülmaschine ausräumen
                  day: today
                  assign_to_maker: true
              shopping:
                summary: Something to buy
                value:
                  title: Spülmaschinentabs
                  quantity: 1 Packung
      responses:
        "200":
          description: The call was taken; the app's key page says what it did.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Done"
        "400":
          $ref: "#/components/responses/Refused"
        "401":
          description: No key, or none that works.
          headers:
            WWW-Authenticate:
              description: "The Bearer scheme, as RFC 6750 asks."
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          $ref: "#/components/responses/Refused"
        "404":
          $ref: "#/components/responses/Refused"
        "405":
          description: Only POST is answered here.
          headers:
            Allow:
              schema:
                type: string
                enum: [POST]
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          $ref: "#/components/responses/Refused"
        "413":
          $ref: "#/components/responses/Refused"
        "415":
          $ref: "#/components/responses/Refused"
        "422":
          $ref: "#/components/responses/Refused"
        "429":
          $ref: "#/components/responses/Later"
        "503":
          $ref: "#/components/responses/Later"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: dct_<public id>_<secret><checksum>
      description: |
        `Authorization: Bearer dct_…`. Never put the key in a URL.
  headers:
    RequestId:
      description: Names this call when you report a failure.
      schema:
        type: string
        format: uuid
  responses:
    Refused:
      description: Nothing was changed; `error` says why.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refusal"
    Later:
      description: |
        Not now: too many calls (`rate_limited`), the key busy with another
        call (`busy`), or the service out of reach (`unavailable`).
      headers:
        Retry-After:
          description: Seconds until a call may succeed.
          schema:
            type: integer
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refusal"
  schemas:
    NewItem:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "\\S"
        day:
          description: |
            The day it is planned for: `today` (in the collection Owner's time
            zone) or a date. Not before today, and inside the item's own
            span if it has one. Collections without days refuse it.
          oneOf:
            - type: string
              enum: [today]
            - type: string
              format: date
        quantity:
          description: How much — on a shopping list only.
          type: string
          minLength: 1
          maxLength: 240
          pattern: "\\S"
        url:
          description: |
            A link kept with the item. Nothing fetches it; a person's tap
            opens it.
          type: string
          format: uri
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://"
          maxLength: 2048
        assign_to_maker:
          description: |
            Makes the key's maker the one it is assigned to. A key assigns no
            one else. Collections of films, books and games refuse it.
          type: boolean
    Done:
      type: object
      required: [ok, key_expires_at]
      properties:
        ok:
          type: boolean
          enum: [true]
        key_expires_at:
          description: When the key stops working, or null if it never does.
          type: string
          format: date-time
          nullable: true
    Refusal:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - not_found
            - method_not_allowed
            - key_missing
            - key_unknown
            - key_revoked
            - key_expired
            - action_not_granted
            - json_expected
            - body_too_large
            - invalid_json
            - invalid_body
            - unknown_field
            - invalid_title
            - invalid_day
            - invalid_quantity
            - invalid_url
            - invalid_assign_to_maker
            - day_in_past
            - field_not_on_this_list
            - too_many_items
            - rate_limited
            - busy
            - unavailable
        field:
          description: The unknown field, with `unknown_field`.
          type: string
        retry_after:
          description: Seconds to wait, with `rate_limited`, `busy` and `unavailable`.
          type: integer
